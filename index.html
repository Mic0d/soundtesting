<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Well Well Well</title>
<style>
  :root {
    --bg: #0f0f12;
    --fg: #f5f5f7;
    --accent: #7c5cff;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .wrap {
    max-width: 420px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 8px;
  }
  p {
    color: #aaa;
    font-size: 0.95rem;
    margin: 0 0 20px;
  }
  .status {
    margin-top: 16px;
    font-size: 0.85rem;
    color: #666;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1> Well Well Well</h1>
    <p>Tap anywhere on the screen.</p>
    <div class="status" id="status"></div>
  </div>

  <audio id="sound" preload="auto">
    <source src="https://www.dropbox.com/scl/fi/f1nagx1cvim5jk5xn6fsk/WellWellWellofficial1.MP3?rlkey=s8yurbeuty44bfhmoxsmkc0ko&st=l8cjkqv2&dl=1" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    const audio = document.getElementById('sound');
    const status = document.getElementById('status');
    let played = false;

    function playSound() {
      if (played) return;
      audio.play()
        .then(() => {
          played = true;
          status.textContent = 'Playing…';
        })
        .catch(() => {
          status.textContent = 'Tap anywhere to play.';
        });
    }

    // Try automatically after 2 seconds (works in some browsers, e.g. after
    // any prior interaction with the site).
    window.addEventListener('load', () => {
      setTimeout(playSound, 2000);
    });

    // Any tap, click, or key press anywhere on the page plays the sound.
    // This is what makes it work reliably on iOS/Safari.
    ['click', 'touchstart', 'keydown'].forEach(evt => {
      document.addEventListener(evt, playSound, { once: false });
    });
  </script>
</body>
</html>
