<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Well Well Well</title>
<style>
  :root {
    --bg: #0f0f12;
    --fg: #f5f5f7;
    --accent: #7c5cff;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .wrap {
    max-width: 420px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 8px;
  }
  p {
    color: #aaa;
    font-size: 0.95rem;
    margin: 0 0 20px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 16px 32px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active {
    filter: brightness(1.15);
  }
  .status {
    margin-top: 16px;
    font-size: 0.85rem;
    color: #666;
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🔊 Well Well Well</h1>
    <p>Tap the button to play the sound.</p>
    <button id="playBtn">▶ Play sound</button>
    <div class="status" id="status"></div>
  </div>

  <audio id="sound" preload="auto">
    <source src="https://www.dropbox.com/scl/fi/f1nagx1cvim5jk5xn6fsk/WellWellWellofficial1.MP3?rlkey=s8yurbeuty44bfhmoxsmkc0ko&st=l8cjkqv2&dl=1" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    const audio = document.getElementById('sound');
    const btn = document.getElementById('playBtn');
    const status = document.getElementById('status');

    // On iOS Safari, audio.play() must be called synchronously, directly
    // inside a real user gesture handler (like "click") — not inside a
    // setTimeout, and not inside a "touchstart" handler that later awaits
    // something. A plain button click handler is the most reliable trigger.
    btn.addEventListener('click', function () {
      audio.play()
        .then(function () {
          status.textContent = 'Playing…';
        })
        .catch(function (err) {
          // Show the real reason so it's easy to diagnose if it still fails
          status.textContent = 'Could not play: ' + err.message;
        });
    });

    audio.addEventListener('error', function () {
      status.textContent = 'Audio failed to load — check the file link.';
    });
  </script>
</body>
</html>
